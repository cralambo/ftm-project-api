spring:
  datasource:
    url: jdbc:postgresql://db-project-api:5432/ftm_project_api_db
    username: ftm_admin
    password: ftm_password
    driver-class-name: org.postgresql.Driver

  mail:
    host: mail-project-api-ftm
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8095

management:
  endpoints:
    web:
      exposure:
        exclude: health, info